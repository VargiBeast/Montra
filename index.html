<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#07111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="Saldo"
  >

  <link rel="apple-touch-icon" href="icon-180.png">

  <title>Saldo</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #07111f;
      --bg2: #0b1728;
      --card: rgba(255,255,255,.075);
      --card-strong: rgba(255,255,255,.11);
      --border: rgba(255,255,255,.12);
      --text: #f5f7fb;
      --muted: #8f9bad;
      --green: #55e6a5;
      --red: #ff6678;
      --blue: #69a8ff;
      --nav: rgba(9,17,29,.82);
      --input: rgba(255,255,255,.075);
    }

    body.light {
      --bg: #f2f5f9;
      --bg2: #e8edf4;
      --card: rgba(255,255,255,.66);
      --card-strong: rgba(255,255,255,.82);
      --border: rgba(0,0,0,.08);
      --text: #101522;
      --muted: #697386;
      --nav: rgba(255,255,255,.8);
      --input: rgba(0,0,0,.045);
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        sans-serif;
    }

    body {
      overflow-x: hidden;
      padding-bottom:
        calc(90px + env(safe-area-inset-bottom));
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================================================
       LOADING
       ========================================================= */

    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(30,115,255,.20),
          transparent 32%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(0,216,144,.13),
          transparent 30%
        ),
        var(--bg);

      transition:
        opacity .25s ease,
        visibility .25s ease;
    }

    #loadingScreen.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-box {
      text-align: center;
    }

    .loading-logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;

      display: grid;
      place-items: center;

      border-radius: 22px;

      font-size: 29px;
      font-weight: 850;

      background:
        linear-gradient(
          145deg,
          #1e74ff,
          #36d99b
        );

      box-shadow:
        0 18px 55px
        rgba(40,130,255,.30);
    }

    .loading-text {
      font-weight: 700;
      font-size: 15px;
    }

    .loading-sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .spinner {
      width: 22px;
      height: 22px;

      margin: 18px auto 0;

      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.16);
      border-top-color: var(--text);

      animation:
        spin .75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       BACKGROUND
       ========================================================= */

    .orb {
      position: fixed;
      width: 260px;
      height: 260px;

      border-radius: 50%;
      filter: blur(75px);
      opacity: .22;

      pointer-events: none;
      z-index: 0;
    }

    .orb.one {
      background: #176fff;
      top: -90px;
      right: -100px;
    }

    .orb.two {
      background: #00d890;
      bottom: 5%;
      left: -130px;
    }

    /* =========================================================
       LOGIN
       ========================================================= */

    #loginScreen {
      min-height:
        calc(
          100vh -
          env(safe-area-inset-top)
        );

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;

      text-align: center;

      padding: 34px 25px;

      border:
        1px solid var(--border);

      background:
        var(--card);

      backdrop-filter:
        blur(30px);

      -webkit-backdrop-filter:
        blur(30px);

      border-radius: 32px;

      box-shadow:
        0 25px 80px
        rgba(0,0,0,.25);
    }

    .logo {
      width: 72px;
      height: 72px;

      margin: 0 auto 20px;

      border-radius: 22px;

      display: grid;
      place-items: center;

      font-size: 30px;
      font-weight: 800;

      background:
        linear-gradient(
          145deg,
          #1e74ff,
          #36d99b
        );

      box-shadow:
        0 15px 45px
        rgba(40,130,255,.3);
    }

    .login-box h1 {
      margin: 0;

      font-size: 32px;
      letter-spacing: -.8px;
    }

    .login-box p {
      color: var(--muted);
      line-height: 1.5;

      margin:
        9px 0 28px;
    }

    .google-btn {
      width: 100%;

      padding: 16px;

      border-radius: 17px;

      background: white;
      color: #111;

      font-weight: 650;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 11px;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.15);
    }

    .google-btn:active {
      transform: scale(.985);
    }

    .google-icon {
      width: 20px;
      height: 20px;
    }

    .login-error {
      margin-top: 14px;

      padding: 12px;

      border-radius: 14px;

      background:
        rgba(255,80,100,.10);

      color: var(--red);

      font-size: 12px;
      line-height: 1.45;
    }

    /* =========================================================
       APP
       ========================================================= */

    #app {
      position: relative;
      z-index: 1;

      max-width: 720px;

      margin: auto;

      padding:
        calc(20px + env(safe-area-inset-top))
        18px
        25px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 18px;
    }

    .brand {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -.8px;
    }

    .avatar {
      width: 42px;
      height: 42px;

      border-radius: 50%;
      overflow: hidden;

      background:
        var(--card-strong);

      border:
        1px solid var(--border);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* =========================================================
       GLASS
       ========================================================= */

    .glass {
      background:
        var(--card);

      border:
        1px solid var(--border);

      backdrop-filter:
        blur(25px);

      -webkit-backdrop-filter:
        blur(25px);

      box-shadow:
        0 16px 50px
        rgba(0,0,0,.12);
    }

    /* =========================================================
       BALANCE
       ========================================================= */

    .balance {
      border-radius: 29px;

      padding: 25px;

      margin-bottom: 13px;

      position: relative;
      overflow: hidden;
    }

    .balance::after {
      content: "";

      position: absolute;

      width: 160px;
      height: 160px;

      right: -80px;
      top: -70px;

      border-radius: 50%;

      background:
        rgba(80,160,255,.16);

      filter: blur(10px);
    }

    .eyebrow {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;

      margin-bottom: 7px;
    }

    .balance-value {
      font-size:
        clamp(39px, 11vw, 58px);

      line-height: 1;

      font-weight: 800;

      letter-spacing: -2.5px;

      margin-bottom: 20px;
    }

    .balance-meta {
      display: flex;
      gap: 18px;
    }

    .meta-item {
      flex: 1;
    }

    .meta-label {
      color: var(--muted);
      font-size: 12px;

      margin-bottom: 4px;
    }

    .meta-value {
      font-size: 15px;
      font-weight: 700;
    }

    .green {
      color: var(--green);
    }

    .red {
      color: var(--red);
    }

    /* =========================================================
       ACTIONS
       ========================================================= */

    .actions {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;

      margin-bottom: 22px;
    }

    .action {
      min-height: 62px;

      border-radius: 20px;

      background:
        var(--card);

      border:
        1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      font-weight: 700;
    }

    .action:active {
      transform: scale(.985);
    }

    .action.primary {
      background:
        linear-gradient(
          135deg,
          #247cff,
          #4b9aff
        );

      border: 0;

      box-shadow:
        0 12px 35px
        rgba(40,120,255,.23);
    }

    .action.in {
      background:
        linear-gradient(
          135deg,
          #24c982,
          #54e4a4
        );

      color: #04140d;

      border: 0;
    }

    .action-icon {
      font-size: 22px;
    }

    /* =========================================================
       SECTIONS
       ========================================================= */

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin:
        22px 2px 11px;
    }

    .section-title h2 {
      margin: 0;

      font-size: 19px;

      letter-spacing: -.3px;
    }

    .section-title span {
      font-size: 13px;
      color: var(--muted);
    }

    /* =========================================================
       TRANSACTIONS
       ========================================================= */

    .transactions {
      display: flex;
      flex-direction: column;

      gap: 9px;
    }

    .transaction {
      width: 100%;

      padding: 15px;

      border-radius: 20px;

      display: flex;
      align-items: center;

      gap: 13px;

      text-align: left;

      transition:
        transform .15s ease;
    }

    .transaction:active {
      transform: scale(.985);
    }

    .transaction-icon {
      width: 45px;
      height: 45px;

      flex:
        0 0 45px;

      border-radius: 15px;

      display: grid;
      place-items: center;

      font-size: 20px;

      background:
        var(--input);

      overflow: hidden;
    }

    .transaction-icon img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    .transaction-info {
      min-width: 0;
      flex: 1;
    }

    .transaction-name {
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .transaction-date {
      color: var(--muted);

      font-size: 12px;

      margin-top: 3px;
    }

    .transaction-amount {
      font-weight: 800;

      white-space: nowrap;
    }

    .product-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      margin-top: 6px;

      padding: 5px 8px;

      border-radius: 9px;

      background:
        rgba(105,168,255,.10);

      color: var(--blue);

      font-size: 11px;
      font-weight: 700;
    }

    .empty {
      text-align: center;

      color: var(--muted);

      padding:
        35px 15px;
    }

    /* =========================================================
       BOTTOM NAV
       ========================================================= */

    .bottom-nav {
      position: fixed;

      z-index: 20;

      left: 12px;
      right: 12px;

      bottom:
        calc(
          10px +
          env(safe-area-inset-bottom)
        );

      max-width: 696px;

      margin: auto;

      padding: 8px;

      border-radius: 25px;

      background:
        var(--nav);

      border:
        1px solid var(--border);

      backdrop-filter:
        blur(28px);

      -webkit-backdrop-filter:
        blur(28px);

      box-shadow:
        0 15px 45px
        rgba(0,0,0,.25);

      display: grid;

      grid-template-columns:
        repeat(3,1fr);
    }

    .nav-btn {
      padding:
        9px 4px;

      border-radius: 18px;

      background: transparent;

      color: var(--muted);

      font-size: 11px;
      font-weight: 650;
    }

    .nav-btn.active {
      color: var(--text);

      background:
        var(--card-strong);
    }

    .nav-icon {
      display: block;

      font-size: 20px;

      margin-bottom: 3px;
    }

    /* =========================================================
       SHEET
       ========================================================= */

    .overlay {
      position: fixed;

      inset: 0;

      z-index: 50;

      background:
        rgba(0,0,0,.5);

      display: flex;

      align-items: flex-end;

      justify-content: center;
    }

    .sheet {
      width: 100%;
      max-width: 720px;

      max-height: 92vh;

      overflow-y: auto;

      background:
        var(--bg2);

      border-radius:
        30px 30px 0 0;

      padding:
        15px
        18px
        calc(
          25px +
          env(safe-area-inset-bottom)
        );

      border-top:
        1px solid var(--border);
    }

    .grabber {
      width: 38px;
      height: 4px;

      border-radius: 4px;

      background:
        var(--muted);

      opacity: .45;

      margin:
        0 auto 18px;
    }

    .sheet-head {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin-bottom: 20px;
    }

    .sheet-head h2 {
      margin: 0;

      font-size: 23px;
    }

    .close {
      width: 35px;
      height: 35px;

      border-radius: 50%;

      background:
        var(--input);

      color: var(--muted);

      font-size: 20px;
    }

    label {
      display: block;

      color: var(--muted);

      font-size: 12px;
      font-weight: 650;

      margin:
        0 0 7px 3px;
    }

    input,
    textarea,
    select {
      width: 100%;

      border:
        1px solid var(--border);

      background:
        var(--input);

      color: var(--text);

      outline: none;

      border-radius: 15px;

      padding: 14px;

      margin-bottom: 15px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color:
        rgba(90,160,255,.6);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .amount-input {
      font-size: 27px;
      font-weight: 750;
    }

    .form-row {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;
    }

    .submit {
      width: 100%;

      padding: 16px;

      border-radius: 17px;

      background:
        linear-gradient(
          135deg,
          #247cff,
          #58a1ff
        );

      font-weight: 750;

      margin-top: 4px;
    }

    .submit:disabled {
      opacity: .55;
    }

    .delete-btn {
      width: 100%;

      padding: 14px;

      border-radius: 17px;

      background:
        rgba(255,80,100,.11);

      color: var(--red);

      font-weight: 700;

      margin-top: 9px;
    }

    .preview {
      display: none;

      width: 100%;

      max-height: 250px;

      object-fit: cover;

      border-radius: 18px;

      margin:
        0 0 15px;
    }

    .existing-image-label {
      display: none;

      margin:
        -5px 0 8px 3px;

      color: var(--muted);

      font-size: 11px;
    }

    /* =========================================================
       LOG
       ========================================================= */

    .search {
      margin-bottom: 13px;
    }

    .filter-row {
      display: flex;

      gap: 8px;

      overflow-x: auto;

      margin-bottom: 14px;

      scrollbar-width: none;
    }

    .filter {
      flex:
        0 0 auto;

      padding:
        9px 14px;

      border-radius: 13px;

      background:
        var(--card);

      border:
        1px solid var(--border);

      color: var(--muted);

      font-size: 13px;
      font-weight: 650;
    }

    .filter.active {
      background:
        var(--text);

      color:
        var(--bg);
    }

    /* =========================================================
       MORE
       ========================================================= */

    .settings-card {
      border-radius: 23px;

      overflow: hidden;

      margin-bottom: 12px;
    }

    .setting {
      width: 100%;

      text-align: left;

      background: transparent;

      padding: 17px;

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      border-bottom:
        1px solid var(--border);
    }

    .setting:last-child {
      border-bottom: 0;
    }

    .setting-title {
      font-weight: 650;
    }

    .setting-sub {
      color: var(--muted);

      font-size: 12px;

      margin-top: 3px;
    }

    .danger {
      color: var(--red);
    }

    /* =========================================================
       PROFILE
       ========================================================= */

    .profile-avatar {
      width: 70px;
      height: 70px;

      margin: auto;

      border-radius: 50%;

      overflow: hidden;

      background:
        var(--input);

      border:
        1px solid var(--border);
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (min-width: 650px) {
      #app {
        padding-top: 35px;
      }

      .bottom-nav {
        bottom: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       LOADING
       ======================================================= -->

  <div id="loadingScreen">
    <div class="loading-box">
      <div class="loading-logo">S</div>

      <div class="loading-text">
        Saldo
      </div>

      <div class="loading-sub">
        Kobler til kontoen din…
      </div>

      <div class="spinner"></div>
    </div>
  </div>

  <div class="orb one"></div>
  <div class="orb two"></div>

  <!-- =======================================================
       LOGIN
       ======================================================= -->

  <section
    id="loginScreen"
    class="hidden"
  >
    <div class="login-box">

      <div class="logo">
        S
      </div>

      <h1>
        Velkommen til Saldo
      </h1>

      <p>
        Hold styr på pengene dine.
        Logg inn én gang, så synkroniseres
        Saldo på tvers av enhetene dine.
      </p>

      <button
        class="google-btn"
        onclick="loginWithGoogle()"
      >
        <svg
          class="google-icon"
          viewBox="0 0 24 24"
        >
          <path
            fill="#4285F4"
            d="M21.35 12.23c0-.78-.07-1.53-.22-2.23H12v4.22h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.38z"
          />
          <path
            fill="#34A853"
            d="M12 21.65c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.28v2.53A9.75 9.75 0 0 0 12 21.65z"
          />
          <path
            fill="#FBBC05"
            d="M6.53 13.74A5.86 5.86 0 0 1 6.22 12c0-.61.11-1.2.31-1.74V7.73H3.28A9.74 9.74 0 0 0 2.25 12c0 1.57.38 3.06 1.03 4.27l3.25-2.53z"
          />
          <path
            fill="#EA4335"
            d="M12 6.23c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.3 14.63 2.35 12 2.35a9.75 9.75 0 0 0-8.72 5.38l3.25 2.53C7.3 7.95 9.46 6.23 12 6.23z"
          />
        </svg>

        Fortsett med Google
      </button>

      <div
        id="loginError"
        class="login-error hidden"
      ></div>

    </div>
  </section>

  <!-- =======================================================
       APP
       ======================================================= -->

  <main
    id="app"
    class="hidden"
  >

    <header>
      <div class="brand">
        Saldo
      </div>

      <button
        class="avatar"
        onclick="openProfile()"
        aria-label="Åpne profil"
      >
        <img
          id="avatar"
          alt=""
        >
      </button>
    </header>

    <!-- HOME -->

    <section id="homePage">

      <div class="balance glass">

        <div class="eyebrow">
          Disponibel saldo
        </div>

        <div
          id="balance"
          class="balance-value"
        >
          0 kr
        </div>

        <div class="balance-meta">

          <div class="meta-item">

            <div class="meta-label">
              Penger inn
            </div>

            <div
              id="totalIn"
              class="meta-value green"
            >
              +0 kr
            </div>

          </div>

          <div class="meta-item">

            <div class="meta-label">
              Brukt
            </div>

            <div
              id="totalOut"
              class="meta-value red"
            >
              −0 kr
            </div>

          </div>

        </div>
      </div>

      <div class="actions">

        <button
          class="action primary"
          onclick="openTransaction('out')"
        >
          <span class="action-icon">
            −
          </span>

          Nytt kjøp
        </button>

        <button
          class="action in"
          onclick="openTransaction('in')"
        >
          <span class="action-icon">
            +
          </span>

          Penger inn
        </button>

      </div>

      <div class="section-title">

        <h2>
          Siste aktivitet
        </h2>

        <span id="homeCount"></span>

      </div>

      <div
        id="recent"
        class="transactions"
      ></div>

    </section>

    <!-- LOG -->

    <section
      id="logPage"
      class="hidden"
    >

      <div class="section-title">

        <h2>
          Alle transaksjoner

  <!-- =======================================================
       JAVASCRIPT
       ======================================================= -->

  <script>

    /* =======================================================
       SUPABASE
       ======================================================= */

    const SUPABASE_URL =
      "https://mnoyxddrywjglobashqx.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_YzLtUjLaJn4T8tDipkfLTQ_ubpK1lQC";

    const {
      createClient
    } = supabase;

    const db =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            flowType: "pkce"
          }
        }
      );

    let user = null;
    let transactions = [];

    let currentType = "out";
    let currentFilter = "all";

    let appStarted = false;
    let startingApp = false;

    /* =======================================================
       HELPERS
       ======================================================= */

    function $(id) {
      return document.getElementById(id);
    }

    function hideLoading() {
      $("loadingScreen")
        .classList.add("loaded");
    }

    function showLogin(errorMessage = "") {

      $("loginScreen")
        .classList.remove("hidden");

      $("app")
        .classList.add("hidden");

      $("nav")
        .classList.add("hidden");

      if (errorMessage) {

        $("loginError")
          .textContent =
          errorMessage;

        $("loginError")
          .classList.remove("hidden");

      } else {

        $("loginError")
          .classList.add("hidden");
      }

      hideLoading();
    }

    function showApp() {

      $("loginScreen")
        .classList.add("hidden");

      $("app")
        .classList.remove("hidden");

      $("nav")
        .classList.remove("hidden");

      hideLoading();
    }

    /* =======================================================
       AUTH
       ======================================================= */

    async function loginWithGoogle() {

      const button =
        document.querySelector(
          ".google-btn"
        );

      button.disabled = true;
      button.style.opacity = ".6";

      try {

        const {
          error
        } =
          await db.auth.signInWithOAuth({
            provider: "google",

            options: {
              redirectTo:
                window.location.origin +
                window.location.pathname
            }
          });

        if (error) {
          throw error;
        }

      } catch (error) {

        console.error(
          "Google login error:",
          error
        );

        showLogin(
          "Kunne ikke starte Google-innlogging: " +
          error.message
        );

        button.disabled = false;
        button.style.opacity = "1";
      }
    }

    async function signOut() {

      try {
        await db.auth.signOut();
      } catch (error) {
        console.error(error);
      }

      user = null;
      transactions = [];

      appStarted = false;
      startingApp = false;

      closeProfile();
      closeTransaction();

      showLogin();
    }

    /*
     * Supabase auth listener.
     */

    db.auth.onAuthStateChange(
      async (event, session) => {

        console.log(
          "Auth event:",
          event
        );

        if (
          session &&
          session.user
        ) {

          user =
            session.user;

          /*
           * Ikke start appen flere ganger.
           */

          if (
            !appStarted &&
            !startingApp
          ) {
            await startApp();
          }

        } else {

          user = null;

          appStarted = false;

          showLogin();
        }
      }
    );

    /*
     * Viktig for iPhone:
     * start appen ved å lese den faktiske
     * sessionen etter at siden er ferdig lastet.
     */

    async function initializeAuth() {

      try {

        const {
          data,
          error
        } =
          await db.auth.getSession();

        if (error) {
          throw error;
        }

        if (
          data &&
          data.session &&
          data.session.user
        ) {

          user =
            data.session.user;

          await startApp();

        } else {

          showLogin();
        }

      } catch (error) {

        console.error(
          "Auth initialization error:",
          error
        );

        showLogin(
          "Kunne ikke koble til Saldo. " +
          "Sjekk internettforbindelsen og prøv igjen."
        );
      }
    }

    /* =======================================================
       START APP
       ======================================================= */

    async function startApp() {

      if (
        startingApp ||
        appStarted
      ) {
        return;
      }

      if (!user) {
        return;
      }

      startingApp = true;

      showApp();

      try {

        const metadata =
          user.user_metadata || {};

        const avatar =
          metadata.avatar_url ||
          metadata.picture ||
          "";

        $("avatar").src =
          avatar;

        $("accountEmail")
          .textContent =
          user.email || "";

        await loadTransactions();

        renderHome();
        renderLog();

        appStarted = true;

      } catch (error) {

        console.error(
          "Start app error:",
          error
        );

        alert(
          "Saldo kunne ikke laste data.\n\n" +
          error.message
        );

      } finally {

        startingApp = false;
        hideLoading();
      }
    }

    /* =======================================================
       DATABASE
       ======================================================= */

    async function loadTransactions() {

      if (!user) return;

      const {
        data,
        error
      } =
        await db
          .from("transactions")
          .select("*")
          .eq(
            "user_id",
            user.id
          )
          .order(
            "date",
            {
              ascending: false
            }
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );

      if (error) {

        console.error(
          "Load transactions:",
          error
        );

        throw error;
      }

      transactions =
        data || [];
    }

    /* =======================================================
       IMAGE STORAGE
       ======================================================= */

    async function uploadPurchaseImage(
      file
    ) {

      if (!file || !user) {
        return null;
      }

      if (
        !file.type.startsWith(
          "image/"
        )
      ) {
        throw new Error(
          "Filen er ikke et bilde."
        );
      }

      if (
        file.size >
        5 * 1024 * 1024
      ) {
        throw new Error(
          "Bildet må være mindre enn 5 MB."
        );
      }

      const extension =
        file.name.includes(".")
          ? file.name
              .split(".")
              .pop()
              .toLowerCase()
          : "jpg";

      const path =
        `${user.id}/${crypto.randomUUID()}.${extension}`;

      const {
        error
      } =
        await db.storage
          .from(
            "purchase-images"
          )
          .upload(
            path,
            file,
            {
              upsert: false,
              contentType:
                file.type,
              cacheControl:
                "3600"
            }
          );

      if (error) {

        console.error(
          "Image upload:",
          error
        );

        throw new Error(
          "Kunne ikke laste opp bildet: " +
          error.message
        );
      }

      return path;
    }

    async function deletePurchaseImage(
      path
    ) {

      if (!path) return;

      const {
        error
      } =
        await db.storage
          .from(
            "purchase-images"
          )
          .remove([
            path
          ]);

      if (error) {

        console.warn(
          "Could not delete image:",
          error
        );
      }
    }

    async function getImageUrl(
      path
    ) {

      if (!path) {
        return "";
      }

      const {
        data,
        error
      } =
        await db.storage
          .from(
            "purchase-images"
          )
          .createSignedUrl(
            path,
            60 * 60 * 24
          );

      if (error) {

        console.error(
          "Signed URL:",
          error
        );

        return "";
      }

      return (
        data?.signedUrl ||
        ""
      );
    }

    async function loadTransactionImages() {

      const images =
        document.querySelectorAll(
          "img[data-image-path]"
        );

      for (
        const img of images
      ) {

        const path =
          img.dataset.imagePath;

        try {

          const url =
            await getImageUrl(
              path
            );

          if (url) {

            img.src = url;

          } else {

            img.style.display =
              "none";
          }

        } catch (error) {

          console.error(
            error
          );

          img.style.display =
            "none";
        }
      }
    }

    /* =======================================================
       SAVE TRANSACTION
       ======================================================= */

    async function saveTransaction(
      event
    ) {

      event.preventDefault();

      if (!user) {
        return;
      }

      const submitButton =
        $("submitButton");

      submitButton.disabled =
        true;

      submitButton.textContent =
        "Lagrer…";

      try {

        const id =
          $("editingId").value;

        const type =
          currentType;

        const name =
          $("name")
            .value
            .trim();

        const amount =
          Number(
            $("amount").value
          );

        const date =
          $("date").value;

        const method =
          $("method").value;

        const link =
          $("link")
            .value
            .trim();

        const note =
          $("note")
            .value
            .trim();

        const file =
          $("image")
            .files[0];

        if (
          !name ||
          !amount ||
          !date
        ) {
          return;
        }

        const existing =
          id
            ? transactions.find(
                t =>
                  t.id === id
              )
            : null;

        /*
         * Behold gammelt bilde
         * dersom det ikke velges
         * et nytt.
         */

        let imagePath =
          existing?.image_url ||
          null;

        let newImagePath =
          null;

        /*
         * Upload nytt bilde.
         */

        if (
          file &&
          type === "out"
        ) {

          newImagePath =
            await uploadPurchaseImage(
              file
            );

          imagePath =
            newImagePath;
        }

        const payload = {
          type,
          name,
          amount,
          date,
          method,
          link:
            type === "out"
              ? (
                  link ||
                  null
                )
              : null,
          note:
            note ||
            null,
          image_url:
            type === "out"
              ? imagePath
              : null
        };

        let result;

        if (id) {

          result =
            await db
              .from(
                "transactions"
              )
              .update(
                payload
              )
              .eq(
                "id",
                id
              )
              .eq(
                "user_id",
                user.id
              );

        } else {

          result =
            await db
              .from(
                "transactions"
              )
              .insert({
                ...payload,
                user_id:
                  user.id
              });
        }

        if (
          result.error
        ) {

          /*
           * Hvis databasen feiler,
           * slett bildet som nettopp
           * ble lastet opp.
           */

          if (
            newImagePath
          ) {
            await deletePurchaseImage(
              newImagePath
            );
          }

          throw result.error;
        }

        /*
         * Nå er databasen lagret.
         * Først nå sletter vi gammelt bilde.
         */

        if (
          existing?.image_url &&
          newImagePath &&
          existing.image_url !==
            newImagePath
        ) {

          await deletePurchaseImage(
            existing.image_url
          );
        }

        closeTransaction();

        await loadTransactions();

        renderHome();
        renderLog();

      } catch (error) {

        console.error(
          "Save transaction:",
          error
        );

        alert(
          "Kunne ikke lagre:\n" +
          error.message
        );

      } finally {

        submitButton.disabled =
          false;

        submitButton.textContent =
          "Lagre";
      }
    }

    /* =======================================================
       DELETE
       ======================================================= */

    async function deleteTransaction() {

      const id =
        $("editingId").value;

      if (
        !id ||
        !confirm(
          "Vil du slette denne transaksjonen?"
        )
      ) {
        return;
      }

      const transaction =
        transactions.find(
          t =>
            t.id === id
        );

      try {

        const {
          error
        } =
          await db
            .from(
              "transactions"
            )
            .delete()
            .eq(
              "id",
              id
            )
            .eq(
              "user_id",
              user.id
            );

        if (error) {
          throw error;
        }

        if (
          transaction?.image_url
        ) {

          await deletePurchaseImage(
            transaction.image_url
          );
        }

        closeTransaction();

        await loadTransactions();

        renderHome();
        renderLog();

      } catch (error) {

        console.error(error);

        alert(
          "Kunne ikke slette:\n" +
          error.message
        );
      }
    }

    /* =======================================================
       MONEY
       ======================================================= */

    function formatMoney(
      value
    ) {

      return new Intl.NumberFormat(
        "nb-NO",
        {
          style:
            "currency",
          currency:
            "NOK",
          maximumFractionDigits:
            0
        }
      ).format(value);
    }

    function formatDate(
      value
    ) {

      return new Date(
        value +
        "T12:00:00"
      ).toLocaleDateString(
        "nb-NO",
        {
          day: "numeric",
          month: "short",
          year: "numeric"
        }
      );
    }

    /* =======================================================
       HOME
       ======================================================= */

    function renderHome() {

      let totalIn = 0;
      let totalOut = 0;

      for (
        const t of
        transactions
      ) {

        if (
          t.type === "in"
        ) {

          totalIn +=
            Number(
              t.amount
            );

        } else {

          totalOut +=
            Number(
              t.amount
            );
        }
      }

      const balance =
        totalIn -
        totalOut;

      $("balance")
        .textContent =
        formatMoney(
          balance
        );

      $("totalIn")
        .textContent =
        "+" +
        formatMoney(
          totalIn
        );

      $("totalOut")
        .textContent =
        "−" +
        formatMoney(
          totalOut
        );

      const recent =
        transactions.slice(
          0,
          8
        );

      $("homeCount")
        .textContent =
        transactions.length +
        " totalt";

      $("recent")
        .innerHTML =
        recent.length
          ? recent
              .map(
                transactionHTML
              )
              .join("")
          : emptyHTML();

      $("logCount")
        .textContent =
        transactions.length +
        " totalt";

      loadTransactionImages();
    }

    /* =======================================================
       TRANSACTION CARD
       ======================================================= */

    function transactionHTML(
      t
    ) {

      const positive =
        t.type === "in";

      const hasImage =
        Boolean(
          t.image_url
        );

      const hasLink =
        Boolean(
          t.link
        );

      return `
        <div
          class="transaction glass"
          data-transaction-id="${escapeHTML(t.id)}"
        >

          ${
            hasImage
              ? `
                <div
                  class="transaction-icon"
                >
                  <img
                    data-image-path="${escapeHTML(t.image_url)}"
                    alt=""
                  >
                </div>
              `
              : `
                <div
                  class="transaction-icon"
                  onclick="editTransaction('${escapeHTML(t.id)}')"
                >
                  ${
                    positive
                      ? "＋"
                      : "−"
                  }
                </div>
              `
          }

          <div
            class="transaction-info"
            onclick="editTransaction('${escapeHTML(t.id)}')"
          >

            <div class="transaction-name">
              ${escapeHTML(t.name)}
            </div>

            <div class="transaction-date">
              ${formatDate(t.date)}
              ${
                t.method
                  ? " · " +
                    escapeHTML(
                      t.method
                    )
                  : ""
              }
            </div>

            ${
              hasLink
                ? `
                  <button
                    type="button"
                    class="product-link"
                    onclick="event.stopPropagation(); openProductLink('${escapeAttribute(t.link)}')"
                  >
                    🔗 Åpne produkt ↗
                  </button>
                `
                : ""
            }

          </div>

          <div
            class="
              transaction-amount
              ${
                positive
                  ? "green"
                  : "red"
              }
            "
            onclick="editTransaction('${escapeHTML(t.id)}')"
          >
            ${
              positive
                ? "+"
                : "−"
            }${formatMoney(
              Number(t.amount)
            )}
          </div>

        </div>
      `;
    }

    function emptyHTML() {

      return `
        <div
          class="glass empty"
          style="border-radius:22px"
        >
          Ingen transaksjoner ennå.<br>
          Legg til ditt første kjøp
          eller penger inn.
        </div>
      `;
    }

    /* =======================================================
       LOG
       ======================================================= */

    function renderLog() {

      const search =
        $("search");

      if (!search) {
        return;
      }

      const query =
        search.value
          .toLowerCase()
          .trim();

      let list =
        transactions;

      if (
        currentFilter !==
        "all"
      ) {

        list =
          list.filter(
            t =>
              t.type ===
              currentFilter
          );
      }

      if (query) {

        list =
          list.filter(
            t =>
              `
                ${t.name}
                ${t.note || ""}
                ${t.method || ""}
              `
                .toLowerCase()
                .includes(
                  query
                )
          );
      }

      $("logList")
        .innerHTML =
        list.length
          ? list
              .map(
                transactionHTML
              )
              .join("")
          : emptyHTML();

      loadTransactionImages();
    }

    function setFilter(
      filter,
      element
    ) {

      currentFilter =
        filter;

      document
        .querySelectorAll(
          ".filter"
        )
        .forEach(
          btn =>
            btn.classList.remove(
              "active"
            )
        );

      element.classList.add(
        "active"
      );

      renderLog();
    }

    /* =======================================================
       NAVIGATION
       ======================================================= */

    function showPage(
      page,
      button
    ) {

      $("homePage")
        .classList.toggle(
          "hidden",
          page !== "home"
        );

      $("logPage")
        .classList.toggle(
          "hidden",
          page !== "log"
        );

      $("morePage")
        .classList.toggle(
          "hidden",
          page !== "more"
        );

      document
        .querySelectorAll(
          ".nav-btn"
        )
        .forEach(
          btn =>
            btn.classList.remove(
              "active"
            )
        );

      button.classList.add(
        "active"
      );

      if (
        page === "home"
      ) {
        renderHome();
      }

      if (
        page === "log"
      ) {
        renderLog();
      }
    }

    /* =======================================================
       TRANSACTION FORM
       ======================================================= */

    function openTransaction(
      type,
      transaction = null
    ) {

      currentType =
        type;

      $("transactionOverlay")
        .classList.remove(
          "hidden"
        );

      $("transactionForm")
        .reset();

      $("editingId")
        .value =
        transaction?.id ||
        "";

      $("date")
        .value =
        transaction?.date ||
        new Date()
          .toISOString()
          .slice(
            0,
            10
          );

      $("formTitle")
        .textContent =
        transaction
          ? "Rediger"
          : type === "out"
            ? "Nytt kjøp"
            : "Penger inn";

      $("purchaseFields")
        .classList.toggle(
          "hidden",
          type !== "out"
        );

      $("deleteButton")
        .classList.toggle(
          "hidden",
          !transaction
        );

      $("openLinkButton")
        .classList.add(
          "hidden"
        );

      $("existingImageLabel")
        .style.display =
        "none";

      $("imagePreview")
        .src = "";

      $("imagePreview")
        .style.display =
        "none";

      if (
        transaction
      ) {

        $("name")
          .value =
          transaction.name ||
          "";

        $("amount")
          .value =
          transaction.amount ||
          "";

        $("date")
          .value =
          transaction.date ||
          "";

        $("method")
          .value =
          transaction.method ||
          "Bankkort";

        $("link")
          .value =
          transaction.link ||
          "";

        $("note")
          .value =
          transaction.note ||
          "";

        if (
          transaction.link
        ) {

          $("openLinkButton")
            .classList.remove(
              "hidden"
            );
        }

        if (
          transaction.image_url
        ) {

          $("existingImageLabel")
            .style.display =
            "block";

          $("imagePreview")
            .style.display =
            "block";

          getImageUrl(
            transaction.image_url
          )
            .then(
              url => {

                if (url) {

                  $("imagePreview")
                    .src =
                    url;

                } else {

                  $("imagePreview")
                    .style.display =
                    "none";
                }
              }
            );
        }
      }
    }

    function editTransaction(
      id
    ) {

      const transaction =
        transactions.find(
          t =>
            t.id === id
        );

      if (!transaction) {
        return;
      }

      openTransaction(
        transaction.type,
        transaction
      );
    }

    function closeTransaction() {

      $("transactionOverlay")
        .classList.add(
          "hidden"
        );

      $("transactionForm")
        .reset();

      $("imagePreview")
        .src = "";

      $("imagePreview")
        .style.display =
        "none";
    }

    function overlayClose(
      event
    ) {

      if (
        event.target ===
        event.currentTarget
      ) {

        closeTransaction();
      }
    }

    function previewImage(
      event
    ) {

      const file =
        event.target.files[0];

      if (!file) {
        return;
      }

      const preview =
        $("imagePreview");

      if (
        preview.dataset.objectUrl
      ) {

        URL.revokeObjectURL(
          preview.dataset.objectUrl
        );
      }

      const url =
        URL.createObjectURL(
          file
        );

      preview.dataset.objectUrl =
        url;

      preview.src =
        url;

      preview.style.display =
        "block";

      $("existingImageLabel")
        .style.display =
        "none";
    }

    /* =======================================================
       PRODUCT LINK
       ======================================================= */

    function openProductLink(
      url
    ) {

      if (!url) {
        return;
      }

      /*
       * iPhone/Safari håndterer vanligvis
       * window.open bedre fra en direkte
       * brukerhandling.
       */

      window.location.href =
        url;
    }

    function openCurrentProductLink() {

      const url =
        $("link")
          .value
          .trim();

      if (url) {
        openProductLink(
          url
        );
      }
    }

    /* =======================================================
       PROFILE
       ======================================================= */

    function openProfile() {

      if (!user) {
        return;
      }

      const metadata =
        user.user_metadata ||
        {};

      const avatar =
        metadata.avatar_url ||
        metadata.picture ||
        "";

      $("profileAvatar")
        .src =
        avatar;

      $("profileName")
        .textContent =
        metadata.full_name ||
        metadata.name ||
        "Saldo-bruker";

      $("profileEmail")
        .textContent =
        user.email ||
        "";

      $("profileOverlay")
        .classList.remove(
          "hidden"
        );
    }

    function closeProfile() {

      $("profileOverlay")
        .classList.add(
          "hidden"
        );
    }

    function profileOverlayClose(
      event
    ) {

      if (
        event.target ===
        event.currentTarget
      ) {

        closeProfile();
      }
    }

    /* =======================================================
       THEME
       ======================================================= */

    function toggleTheme() {

      document.body
        .classList.toggle(
          "light"
        );

      const light =
        document.body
          .classList.contains(
            "light"
          );

      localStorage.setItem(
        "saldo_theme",
        light
          ? "light"
          : "dark"
      );

      $("themeText")
        .textContent =
        light
          ? "Lys modus"
          : "Mørk modus";
    }

    const savedTheme =
      localStorage.getItem(
        "saldo_theme"
      );

    if (
      savedTheme ===
      "light"
    ) {

      document.body
        .classList.add(
          "light"
        );

      $("themeText")
        .textContent =
        "Lys modus";
    }

    /* =======================================================
       BACKUP
       ======================================================= */

    function exportData() {

      const backup = {
        app: "Saldo",
        version: 3,
        exportedAt:
          new Date()
            .toISOString(),
        transactions
      };

      const blob =
        new Blob(
          [
            JSON.stringify(
              backup,
              null,
              2
            )
          ],
          {
            type:
              "application/json"
          }
        );

      const url =
        URL.createObjectURL(
          blob
        );

      const a =
        document.createElement(
          "a"
        );

      a.href =
        url;

      a.download =
        "saldo-backup-" +
        new Date()
          .toISOString()
          .slice(
            0,
            10
          ) +
        ".json";

      document.body
        .appendChild(a);

      a.click();

      a.remove();

      setTimeout(
        () =>
          URL.revokeObjectURL(
            url
          ),
        1000
      );
    }

    async function importData(
      event
    ) {

      const file =
        event.target.files[0];

      if (!file) {
        return;
      }

      try {

        const text =
          await file.text();

        const backup =
          JSON.parse(
            text
          );

        if (
          !Array.isArray(
            backup.transactions
          )
        ) {

          throw new Error(
            "Ugyldig backup."
          );
        }

        for (
          const t of
          backup.transactions
        ) {

          const {
            error
          } =
            await db
              .from(
                "transactions"
              )
              .insert({
                user_id:
                  user.id,

                type:
                  t.type,

                name:
                  t.name,

                amount:
                  Number(
                    t.amount
                  ),

                date:
                  t.date,

                method:
                  t.method ||
                  null,

                link:
                  t.link ||
                  null,

                note:
                  t.note ||
                  null,

                image_url:
                  null
              });

          if (error) {
            throw error;
          }
        }

        await loadTransactions();

        renderHome();
        renderLog();

        alert(
          "Backup importert."
        );

      } catch (error) {

        console.error(error);

        alert(
          "Kunne ikke importere backup:\n" +
          error.message
        );

      } finally {

        event.target.value =
          "";
      }
    }

    /* =======================================================
       HTML SECURITY
       ======================================================= */

    function escapeHTML(
      value
    ) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );
    }

    function escapeAttribute(
      value
    ) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "\\",
          "\\\\"
        )
        .replaceAll(
          "'",
          "\\'"
        )
        .replaceAll(
          "\n",
          "\\n"
        )
        .replaceAll(
          "\r",
          "\\r"
        );
    }

    /* =======================================================
       START
       ======================================================= */

    window.addEventListener(
      "error",
      event => {

        console.error(
          "Global error:",
          event.error ||
          event.message
        );
      }
    );

    window.addEventListener(
      "unhandledrejection",
      event => {

        console.error(
          "Unhandled promise:",
          event.reason
        );
      }
    );

    /*
     * Vent til hele HTML-en er ferdig.
     * Dette er viktig på mobil/Safari.
     */

    if (
      document.readyState ===
      "loading"
    ) {

      document.addEventListener(
        "DOMContentLoaded",
        initializeAuth
      );

    } else {

      initializeAuth();
    }

  </script>

</body>
</html>
