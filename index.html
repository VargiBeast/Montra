<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f0eb" />
    <meta name="application-name" content="Montra" />
    <meta name="description" content="Montra is a personal money journal for tracking spending, receipts, savings goals and wishlists." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Montra" />
    <meta property="og:title" content="Montra — personal money management" />
    <meta property="og:description" content="Track spending, receipts, savings goals and wishlists with Montra." />
    <meta property="og:url" content="https://montra.cash/" />
    <meta property="og:image" content="https://montra.cash/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Montra — personal money management" />
    <meta name="twitter:description" content="Track spending, receipts, savings goals and wishlists with Montra." />
    <meta name="twitter:image" content="https://montra.cash/icons/icon-512.png" />
    <link rel="canonical" href="https://montra.cash/" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Montra" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Montra — personal money management</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("saldo-theme") || localStorage.getItem("saldo_theme");
          var mode = saved === "light" || saved === "dark" || saved === "system" ? saved : "system";
          var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#111214" : "#f2f0eb");
        } catch (e) {
          /* theme still applied later by the app shell */
        }
      })();
    </script>
    <script>
      /* Home-screen / installed PWA: open the app shell, not the marketing site. */
      (function () {
        try {
          var standalone =
            window.matchMedia("(display-mode: standalone)").matches ||
            window.matchMedia("(display-mode: fullscreen)").matches ||
            window.navigator.standalone === true;
          if (!standalone) return;
          var path = window.location.pathname || "/";
          if (path === "/" || path === "") {
            window.location.replace("/app" + window.location.search + window.location.hash);
          }
        } catch (e) {
          /* stay on current page */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
