<script>
  /* =========================================================
     SUPABASE
     ========================================================= */

  const SUPABASE_URL =
    "https://mnoyxddrywjglobashqx.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_YzLtUjLaJn4T8tDipkfLTQ_ubpK1lQC";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let user = null;
  let transactions = [];
  let currentType = "out";
  let currentFilter = "all";

  /* =========================================================
     AUTH
     ========================================================= */

  async function loginWithGoogle() {
    const { error } = await db.auth.signInWithOAuth({
      provider: "google",
      options: {
        redirectTo:
          window.location.origin +
          window.location.pathname
      }
    });

    if (error) {
      alert(
        "Kunne ikke starte Google-innlogging:\n" +
        error.message
      );
    }
  }

  async function signOut() {
    await db.auth.signOut();

    user = null;
    transactions = [];

    document.getElementById("app")
      .classList.add("hidden");

    document.getElementById("nav")
      .classList.add("hidden");

    document.getElementById("loginScreen")
      .classList.remove("hidden");

    closeProfile();
  }

  db.auth.onAuthStateChange(async (event, session) => {
    if (session?.user) {
      user = session.user;
      await startApp();
    } else {
      user = null;

      document.getElementById("loginScreen")
        .classList.remove("hidden");

      document.getElementById("app")
        .classList.add("hidden");

      document.getElementById("nav")
        .classList.add("hidden");
    }
  });

  async function startApp() {
    document.getElementById("loginScreen")
      .classList.add("hidden");

    document.getElementById("app")
      .classList.remove("hidden");

    document.getElementById("nav")
      .classList.remove("hidden");

    const metadata = user.user_metadata || {};

    const avatar =
      metadata.avatar_url ||
      metadata.picture ||
      "";

    document.getElementById("avatar").src = avatar;

    document.getElementById("accountEmail")
      .textContent = user.email || "";

    await loadTransactions();

    renderHome();
    renderLog();
  }

  /* =========================================================
     DATABASE
     ========================================================= */

  async function loadTransactions() {
    const { data, error } = await db
      .from("transactions")
      .select("*")
      .eq("user_id", user.id)
      .order("date", { ascending: false })
      .order("created_at", { ascending: false });

    if (error) {
      console.error(error);
      alert(
        "Kunne ikke laste transaksjonene:\n" +
        error.message
      );
      return;
    }

    transactions = data || [];
  }

  /* =========================================================
     IMAGE STORAGE
     ========================================================= */

  async function uploadPurchaseImage(file) {
    if (!file || !user) return null;

    if (!file.type.startsWith("image/")) {
      throw new Error("Filen er ikke et bilde.");
    }

    if (file.size > 5 * 1024 * 1024) {
      throw new Error(
        "Bildet må være mindre enn 5 MB."
      );
    }

    const extension =
      file.name.includes(".")
        ? file.name.split(".").pop().toLowerCase()
        : "jpg";

    const path =
      `${user.id}/${crypto.randomUUID()}.${extension}`;

    const { error } =
      await db.storage
        .from("purchase-images")
        .upload(path, file, {
          upsert: false,
          contentType: file.type,
          cacheControl: "3600"
        });

    if (error) {
      console.error(error);
      throw new Error(
        "Kunne ikke laste opp bildet: " +
        error.message
      );
    }

    return path;
  }

  async function deletePurchaseImage(path) {
    if (!path) return;

    const { error } =
      await db.storage
        .from("purchase-images")
        .remove([path]);

    if (error) {
      console.warn(
        "Kunne ikke slette gammelt bilde:",
        error
      );
    }
  }

  /*
   * Private bucket = vi trenger en signed URL
   * for å vise bildet.
   */

  async function getImageUrl(path) {
    if (!path) return "";

    const { data, error } =
      await db.storage
        .from("purchase-images")
        .createSignedUrl(path, 60 * 60);

    if (error) {
      console.error(
        "Kunne ikke lage signed URL:",
        error
      );
      return "";
    }

    return data?.signedUrl || "";
  }

  /* =========================================================
     SAVE TRANSACTION
     ========================================================= */

  async function saveTransaction(event) {
    event.preventDefault();

    if (!user) return;

    const id =
      document.getElementById("editingId").value;

    const type = currentType;

    const name =
      document.getElementById("name")
        .value
        .trim();

    const amount =
      Number(
        document.getElementById("amount").value
      );

    const date =
      document.getElementById("date").value;

    const method =
      document.getElementById("method").value;

    const link =
      document.getElementById("link")
        .value
        .trim();

    const note =
      document.getElementById("note")
        .value
        .trim();

    const file =
      document.getElementById("image")
        .files[0];

    if (!name || !amount || !date) {
      return;
    }

    /*
     * Hvis vi redigerer et eksisterende kjøp,
     * behold det gamle bildet dersom brukeren
     * ikke velger et nytt.
     */

    const existingTransaction =
      id
        ? transactions.find(t => t.id === id)
        : null;

    let imageUrl =
      existingTransaction?.image_url || null;

    /*
     * Last opp nytt bilde hvis brukeren valgte ett.
     */

    if (file && type === "out") {
      try {
        const newImageUrl =
          await uploadPurchaseImage(file);

        /*
         * Det nye bildet er lastet opp.
         * Vi beholder det gamle til databasen
         * er oppdatert.
         */

        const oldImageUrl =
          existingTransaction?.image_url || null;

        imageUrl = newImageUrl;

        const payload = {
          type,
          name,
          amount,
          date,
          method,
          link,
          note,
          image_url: imageUrl
        };

        let result;

        if (id) {
          result = await db
            .from("transactions")
            .update(payload)
            .eq("id", id)
            .eq("user_id", user.id);
        } else {
          result = await db
            .from("transactions")
            .insert({
              ...payload,
              user_id: user.id
            });
        }

        if (result.error) {
          /*
           * Hvis databasen feiler etter upload,
           * fjern det nye bildet igjen.
           */
          await deletePurchaseImage(newImageUrl);

          console.error(result.error);

          alert(
            "Kunne ikke lagre transaksjonen:\n" +
            result.error.message
          );

          return;
        }

        /*
         * Først når databasen er lagret,
         * sletter vi gammelt bilde.
         */

        if (
          id &&
          oldImageUrl &&
          oldImageUrl !== newImageUrl
        ) {
          await deletePurchaseImage(oldImageUrl);
        }

      } catch (error) {
        console.error(error);

        alert(
          error.message ||
          "Kunne ikke laste opp bildet."
        );

        return;
      }

    } else {

      /*
       * Ingen nytt bilde:
       * behold eksisterende image_url.
       */

      const payload = {
        type,
        name,
        amount,
        date,
        method,
        link: type === "out" ? link : null,
        note,
        image_url:
          type === "out"
            ? imageUrl
            : null
      };

      let result;

      if (id) {

        result = await db
          .from("transactions")
          .update(payload)
          .eq("id", id)
          .eq("user_id", user.id);

      } else {

        result = await db
          .from("transactions")
          .insert({
            ...payload,
            user_id: user.id
          });
      }

      if (result.error) {
        console.error(result.error);

        alert(
          "Kunne ikke lagre transaksjonen:\n" +
          result.error.message
        );

        return;
      }
    }

    closeTransaction();

    await loadTransactions();

    renderHome();
    renderLog();
  }

  /* =========================================================
     DELETE TRANSACTION
     ========================================================= */

  async function deleteTransaction() {
    const id =
      document.getElementById("editingId").value;

    if (
      !id ||
      !confirm(
        "Vil du slette denne transaksjonen?"
      )
    ) {
      return;
    }

    const transaction =
      transactions.find(
        t => t.id === id
      );

    const { error } =
      await db
        .from("transactions")
        .delete()
        .eq("id", id)
        .eq("user_id", user.id);

    if (error) {
      console.error(error);

      alert(
        "Kunne ikke slette transaksjonen:\n" +
        error.message
      );

      return;
    }

    if (transaction?.image_url) {
      await deletePurchaseImage(
        transaction.image_url
      );
    }

    closeTransaction();

    await loadTransactions();

    renderHome();
    renderLog();
  }

  /* =========================================================
     MONEY / DATE
     ========================================================= */

  function formatMoney(value) {
    return new Intl.NumberFormat("nb-NO", {
      style: "currency",
      currency: "NOK",
      maximumFractionDigits: 0
    }).format(value);
  }

  function formatDate(value) {
    return new Date(
      value + "T12:00:00"
    ).toLocaleDateString(
      "nb-NO",
      {
        day: "numeric",
        month: "short",
        year: "numeric"
      }
    );
  }

  /* =========================================================
     HOME
     ========================================================= */

  function renderHome() {
    let totalIn = 0;
    let totalOut = 0;

    for (const t of transactions) {
      if (t.type === "in") {
        totalIn += Number(t.amount);
      } else {
        totalOut += Number(t.amount);
      }
    }

    const balance =
      totalIn - totalOut;

    document.getElementById("balance")
      .textContent =
      formatMoney(balance);

    document.getElementById("totalIn")
      .textContent =
      "+" + formatMoney(totalIn);

    document.getElementById("totalOut")
      .textContent =
      "−" + formatMoney(totalOut);

    const recent =
      transactions.slice(0, 8);

    document.getElementById("homeCount")
      .textContent =
      transactions.length +
      " totalt";

    document.getElementById("recent")
      .innerHTML =
      recent.length
        ? recent.map(transactionHTML).join("")
        : emptyHTML();

    document.getElementById("logCount")
      .textContent =
      transactions.length +
      " totalt";
  }

  /* =========================================================
     TRANSACTION HTML
     ========================================================= */

  function transactionHTML(t) {
    const positive =
      t.type === "in";

    const hasImage =
      Boolean(t.image_url);

    const hasLink =
      Boolean(t.link);

    return `
      <button
        class="transaction glass"
        onclick="editTransaction('${t.id}')"
      >

        ${
          hasImage
            ? `
              <div
                class="transaction-icon"
                style="
                  overflow:hidden;
                  padding:0;
                "
              >
                <img
                  data-image-path="${escapeHTML(t.image_url)}"
                  alt=""
                  style="
                    width:100%;
                    height:100%;
                    object-fit:cover;
                    display:block;
                  "
                >
              </div>
            `
            : `
              <div class="transaction-icon">
                ${positive ? "＋" : "−"}
              </div>
            `
        }

        <div class="transaction-info">

          <div class="transaction-name">
            ${escapeHTML(t.name)}
          </div>

          <div class="transaction-date">
            ${formatDate(t.date)}
            ${
              t.method
                ? " · " +
                  escapeHTML(t.method)
                : ""
            }
          </div>

          ${
            hasLink
              ? `
                <div
                  style="
                    color:var(--blue);
                    font-size:11px;
                    margin-top:4px;
                  "
                >
                  🔗 Produktlenke
                </div>
              `
              : ""
          }

        </div>

        <div
          class="
            transaction-amount
            ${positive ? "green" : "red"}
          "
        >
          ${
            positive
              ? "+"
              : "−"
          }${formatMoney(
            Number(t.amount)
          )}
        </div>

      </button>
    `;
  }

  /*
   * Etter at kortene er laget,
   * hent signed URLs for private bilder.
   */

  async function loadTransactionImages() {
    const images =
      document.querySelectorAll(
        "img[data-image-path]"
      );

    for (const img of images) {
      const path =
        img.dataset.imagePath;

      const url =
        await getImageUrl(path);

      if (url) {
        img.src = url;
      } else {
        img.style.display = "none";
      }
    }
  }

  function emptyHTML() {
    return `
      <div
        class="glass empty"
        style="border-radius:22px"
      >
        Ingen transaksjoner ennå.<br>
        Legg til ditt første kjøp
        eller penger inn.
      </div>
    `;
  }

  /* =========================================================
     LOG
     ========================================================= */

  function renderLog() {
    const query =
      document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    let list = transactions;

    if (currentFilter !== "all") {
      list =
        list.filter(
          t => t.type === currentFilter
        );
    }

    if (query) {
      list =
        list.filter(t =>
          `${t.name} ${
            t.note || ""
          } ${
            t.method || ""
          }`
            .toLowerCase()
            .includes(query)
        );
    }

    document.getElementById("logList")
      .innerHTML =
      list.length
        ? list.map(transactionHTML).join("")
        : emptyHTML();

    loadTransactionImages();
  }

  function setFilter(
    filter,
    element
  ) {
    currentFilter = filter;

    document
      .querySelectorAll(".filter")
      .forEach(
        btn =>
          btn.classList.remove(
            "active"
          )
      );

    element.classList.add("active");

    renderLog();
  }

  function showPage(
    page,
    button
  ) {
    document
      .getElementById("homePage")
      .classList.toggle(
        "hidden",
        page !== "home"
      );

    document
      .getElementById("logPage")
      .classList.toggle(
        "hidden",
        page !== "log"
      );

    document
      .getElementById("morePage")
      .classList.toggle(
        "hidden",
        page !== "more"
      );

    document
      .querySelectorAll(".nav-btn")
      .forEach(
        btn =>
          btn.classList.remove(
            "active"
          )
      );

    button.classList.add("active");

    if (page === "home") {
      renderHome();
      loadTransactionImages();
    }

    if (page === "log") {
      renderLog();
    }
  }

  /* =========================================================
     TRANSACTION FORM
     ========================================================= */

  function openTransaction(
    type,
    transaction = null
  ) {
    currentType = type;

    document
      .getElementById(
        "transactionOverlay"
      )
      .classList.remove("hidden");

    document
      .getElementById(
        "transactionForm"
      )
      .reset();

    document
      .getElementById(
        "editingId"
      )
      .value =
      transaction?.id || "";

    document
      .getElementById("date")
      .value =
      transaction?.date ||
      new Date()
        .toISOString()
        .slice(0, 10);

    document
      .getElementById("formTitle")
      .textContent =
      transaction
        ? "Rediger"
        : type === "out"
          ? "Nytt kjøp"
          : "Penger inn";

    document
      .getElementById(
        "purchaseFields"
      )
      .classList.toggle(
        "hidden",
        type !== "out"
      );

    document
      .getElementById(
        "deleteButton"
      )
      .classList.toggle(
        "hidden",
        !transaction
      );

    const preview =
      document.getElementById(
        "imagePreview"
      );

    preview.src = "";
    preview.style.display = "none";

    if (transaction) {
      document
        .getElementById("name")
        .value =
        transaction.name || "";

      document
        .getElementById("amount")
        .value =
        transaction.amount || "";

      document
        .getElementById("date")
        .value =
        transaction.date || "";

      document
        .getElementById("method")
        .value =
        transaction.method ||
        "Bankkort";

      document
        .getElementById("link")
        .value =
        transaction.link || "";

      document
        .getElementById("note")
        .value =
        transaction.note || "";

      /*
       * Vis eksisterende bilde i redigeringsvinduet.
       */

      if (transaction.image_url) {
        preview.style.display =
          "block";

        preview.alt =
          "Bilde av kjøpet";

        getImageUrl(
          transaction.image_url
        ).then(url => {
          if (url) {
            preview.src = url;
          } else {
            preview.style.display =
              "none";
          }
        });
      }
    }
  }

  function editTransaction(id) {
    const t =
      transactions.find(
        item => item.id === id
      );

    if (!t) return;

    openTransaction(
      t.type,
      t
    );
  }

  function closeTransaction() {
    document
      .getElementById(
        "transactionOverlay"
      )
      .classList.add("hidden");

    document
      .getElementById(
        "transactionForm"
      )
      .reset();

    document
      .getElementById(
        "imagePreview"
      ).style.display = "none";
  }

  function overlayClose(event) {
    if (
      event.target ===
      event.currentTarget
    ) {
      closeTransaction();
    }
  }

  function previewImage(event) {
    const file =
      event.target.files[0];

    if (!file) return;

    const preview =
      document.getElementById(
        "imagePreview"
      );

    /*
     * Dette viser bildet umiddelbart
     * før det lastes opp.
     */

    if (
      preview.dataset.objectUrl
    ) {
      URL.revokeObjectURL(
        preview.dataset.objectUrl
      );
    }

    const url =
      URL.createObjectURL(file);

    preview.dataset.objectUrl =
      url;

    preview.src = url;
    preview.style.display =
      "block";
  }

  /* =========================================================
     PRODUCT LINK
     ========================================================= */

  function openProductLink(url) {
    if (!url) return;

    window.open(
      url,
      "_blank",
      "noopener,noreferrer"
    );
  }

  /* =========================================================
     PROFILE
     ========================================================= */

  function openProfile() {
    if (!user) return;

    const meta =
      user.user_metadata || {};

    const avatar =
      meta.avatar_url ||
      meta.picture ||
      "";

    document
      .getElementById(
        "profileAvatar"
      )
      .src = avatar;

    document
      .getElementById(
        "profileName"
      )
      .textContent =
      meta.full_name ||
      meta.name ||
      "Saldo-bruker";

    document
      .getElementById(
        "profileEmail"
      )
      .textContent =
      user.email || "";

    document
      .getElementById(
        "profileOverlay"
      )
      .classList.remove(
        "hidden"
      );
  }

  function closeProfile() {
    document
      .getElementById(
        "profileOverlay"
      )
      .classList.add("hidden");
  }

  function profileOverlayClose(
    event
  ) {
    if (
      event.target ===
      event.currentTarget
    ) {
      closeProfile();
    }
  }

  /* =========================================================
     THEME
     ========================================================= */

  function toggleTheme() {
    document.body.classList.toggle(
      "light"
    );

    const light =
      document.body.classList.contains(
        "light"
      );

    localStorage.setItem(
      "saldo_theme",
      light
        ? "light"
        : "dark"
    );

    document
      .getElementById(
        "themeText"
      )
      .textContent =
      light
        ? "Lys modus"
        : "Mørk modus";
  }

  const savedTheme =
    localStorage.getItem(
      "saldo_theme"
    );

  if (savedTheme === "light") {
    document.body.classList.add(
      "light"
    );

    document
      .getElementById(
        "themeText"
      )
      .textContent =
      "Lys modus";
  }

  /* =========================================================
     BACKUP
     ========================================================= */

  function exportData() {
    const backup = {
      app: "Saldo",
      version: 3,
      exportedAt:
        new Date().toISOString(),
      transactions
    };

    const blob =
      new Blob(
        [
          JSON.stringify(
            backup,
            null,
            2
          )
        ],
        {
          type:
            "application/json"
        }
      );

    const url =
      URL.createObjectURL(
        blob
      );

    const a =
      document.createElement(
        "a"
      );

    a.href = url;

    a.download =
      "saldo-backup-" +
      new Date()
        .toISOString()
        .slice(0, 10) +
      ".json";

    a.click();

    URL.revokeObjectURL(url);
  }

  async function importData(
    event
  ) {
    const file =
      event.target.files[0];

    if (!file) return;

    try {
      const text =
        await file.text();

      const backup =
        JSON.parse(text);

      if (
        !Array.isArray(
          backup.transactions
        )
      ) {
        throw new Error(
          "Ugyldig backup."
        );
      }

      for (
        const t of
        backup.transactions
      ) {
        const { error } =
          await db
            .from("transactions")
            .insert({
              user_id:
                user.id,
              type:
                t.type,
              name:
                t.name,
              amount:
                Number(
                  t.amount
                ),
              date:
                t.date,
              method:
                t.method ||
                null,
              link:
                t.link ||
                null,
              note:
                t.note ||
                null,
              image_url:
                t.image_url ||
                null
            });

        if (error) {
          throw error;
        }
      }

      await loadTransactions();

      renderHome();
      renderLog();

      alert(
        "Backup importert."
      );

    } catch (error) {
      console.error(error);

      alert(
        "Kunne ikke importere backup:\n" +
        error.message
      );
    }

    event.target.value = "";
  }

  /* =========================================================
     SECURITY / HTML
     ========================================================= */

  function escapeHTML(value) {
    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );
  }
</script>
