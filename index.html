    <script>
      (function () {
        try {
          var saved = localStorage.getItem("saldo-theme") || localStorage.getItem("saldo_theme");
          var mode = saved === "light" || saved === "dark" || saved === "system" ? saved : "system";
          var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#111214" : "#f2f0eb");
        } catch (e) {
          /* theme still applied later by the app shell */
        }
      })();
    </script>
    <script>
      /* Home-screen / installed PWA: open the app shell, not the marketing site. */
      (function () {
        try {
          var standalone =
            window.matchMedia("(display-mode: standalone)").matches ||
            window.matchMedia("(display-mode: fullscreen)").matches ||
            window.navigator.standalone === true;
          if (!standalone) return;
          var path = window.location.pathname || "/";
          if (path === "/" || path === "") {
            window.location.replace("/app" + window.location.search + window.location.hash);
          }
        } catch (e) {
          /* stay on current page */
        }
      })();
    </script>
