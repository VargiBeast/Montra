name: Verify

on:
  push:
    branches: [feature/complete-montra-rebuild]
  pull_request:
    branches: [feature/complete-montra-rebuild]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
